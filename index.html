<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>My Music Player</title>

<style>
:root{
  --bg:#09090b;
  --surface:#111114;
  --surface-2:#18181c;
  --surface-3:#202025;
  --text:#f5f5f7;
  --text-soft:#a7a7ad;
  --border:rgba(255,255,255,.08);
  --accent:#9b5cff;
  --accent-2:#7c3aed;
  --shadow:0 12px 35px rgba(0,0,0,.35);
  --player-height:210px;
}

body.light{
  --bg:#f6f6f8;
  --surface:#fff;
  --surface-2:#f0f0f3;
  --surface-3:#e7e7eb;
  --text:#111114;
  --text-soft:#66666d;
  --border:rgba(0,0,0,.08);
  --shadow:0 12px 30px rgba(0,0,0,.10);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  padding-bottom:calc(var(--player-height) + 25px);
  transition:background .25s ease,color .25s ease;
}

button,input{font:inherit}
button{color:inherit}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(180deg,var(--surface),rgba(17,17,20,.96));
  border-bottom:1px solid var(--border);
  padding:18px max(18px,env(safe-area-inset-right)) 16px max(18px,env(safe-area-inset-left));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

body.light header{background:rgba(255,255,255,.92)}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  max-width:1100px;
  margin:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-icon{
  font-size:28px;
  color:var(--accent);
  line-height:1;
}

.brand-title{
  font-size:24px;
  font-weight:750;
  letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--text),var(--accent));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  white-space:nowrap;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.header-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s ease;
}

.header-btn:hover,
.header-btn.active{
  color:var(--accent);
  border-color:rgba(155,92,255,.45);
  background:var(--surface-3);
}

.header-btn:active{transform:scale(.93)}

.header-icon{
  font-size:21px;
  line-height:1;
}

/* SEARCH */

.search-wrap{
  max-width:1100px;
  margin:12px auto 0;
  display:none;
}

.search-wrap.open{display:block}

#search{
  width:100%;
  padding:14px 17px;
  border-radius:15px;
  border:1px solid var(--border);
  outline:none;
  background:var(--surface-2);
  color:var(--text);
  font-size:17px;
}

#search::placeholder{color:var(--text-soft)}

#search:focus{
  border-color:rgba(155,92,255,.55);
  box-shadow:0 0 0 3px rgba(155,92,255,.10);
}

/* MAIN */

main{
  max-width:1100px;
  margin:auto;
  padding:22px 18px 30px;
}

.section-title{
  font-size:17px;
  font-weight:650;
  margin:14px 0 13px;
  color:var(--text-soft);
}

/* FOLDERS */

#folders{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

#folders::-webkit-scrollbar{display:none}

.folder-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:linear-gradient(145deg,var(--surface-3),var(--surface-2));
  color:var(--text-soft);
  padding:10px 17px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 4px 14px rgba(0,0,0,.10);
  transition:.2s ease;
}

.folder-btn:active{transform:scale(.96)}

.folder-btn.active{
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;
  box-shadow:0 5px 18px rgba(124,58,237,.24);
}

/* SONGS */

#songs{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.song-row{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:68px;
  padding:10px 13px;
  border-radius:16px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,var(--surface-2),var(--surface));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  cursor:pointer;
  transition:.12s ease;
}

.song-row:active{transform:scale(.99)}

.song-row.active{
  border-color:rgba(155,92,255,.45);
  background:linear-gradient(145deg,rgba(155,92,255,.16),var(--surface-2));
  box-shadow:inset 3px 0 0 var(--accent),0 7px 22px rgba(0,0,0,.16);
}

.song-number{
  width:28px;
  text-align:center;
  color:var(--text-soft);
  font-size:16px;
  flex-shrink:0;
}

.song-row.active .song-number{
  color:var(--accent);
  font-weight:700;
}

.song-name{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:16px;
}

.favorite-btn{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  color:var(--text-soft);
  font-size:25px;
  cursor:pointer;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.favorite-btn.active{color:var(--accent)}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--text-soft);
}

/* PLAYER */

#player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  background:linear-gradient(180deg,rgba(18,18,21,.97),rgba(8,8,10,.99));
  border-top:1px solid var(--border);
  padding:13px max(18px,env(safe-area-inset-right)) max(17px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:0 -12px 35px rgba(0,0,0,.25);
}

body.light #player{background:rgba(255,255,255,.96)}

.player-inner{
  max-width:900px;
  margin:auto;
}

#nowPlaying{
  text-align:center;
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:10px;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:9px;
}

.time{
  width:40px;
  font-size:12px;
  color:var(--text-soft);
  text-align:center;
}

#progress{
  flex:1;
  height:5px;
  appearance:none;
  -webkit-appearance:none;
  border-radius:99px;
  background:var(--surface-3);
  outline:none;
  cursor:pointer;
}

#progress::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:15px;
  height:15px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(155,92,255,.12);
}

#progress::-moz-range-thumb{
  width:15px;
  height:15px;
  border:0;
  border-radius:50%;
  background:var(--accent);
}

/* CONTROLS */

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:13px;
}

.control-btn{
  width:50px;
  height:50px;
  border-radius:15px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,var(--surface-3),var(--surface-2));
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 5px 16px rgba(0,0,0,.15);
  transition:.12s ease;
}

.control-btn:active{transform:scale(.92)}

.control-btn.main{
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  border-color:transparent;
  color:#fff;
  box-shadow:0 8px 25px rgba(124,58,237,.30);
}

.control-btn.mode.active{
  color:var(--accent);
  border-color:rgba(155,92,255,.45);
  background:rgba(155,92,255,.10);
}

.control-icon{
  font-size:20px;
  line-height:1;
  font-weight:500;
}

.main .control-icon{
  font-size:23px;
}

/* VOLUME POPUP */

.volume-popup{
  position:absolute;
  right:18px;
  bottom:73px;
  display:none;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
  box-shadow:var(--shadow);
}

.volume-popup.open{display:flex}

.volume-mute{
  width:38px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface-3);
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

#volume{
  width:175px;
  height:5px;
  appearance:none;
  -webkit-appearance:none;
  border-radius:99px;
  background:var(--surface-3);
  outline:none;
  cursor:pointer;
}

#volume::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:15px;
  height:15px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(155,92,255,.12);
}

#volume::-moz-range-thumb{
  width:15px;
  height:15px;
  border:0;
  border-radius:50%;
  background:var(--accent);
}

#volume::-moz-range-progress{
  height:5px;
  border-radius:99px;
  background:var(--accent);
}

#volume::-moz-range-track{
  height:5px;
  border-radius:99px;
  background:var(--surface-3);
}

#status{
  text-align:center;
  color:var(--text-soft);
  font-size:12px;
  margin-top:7px;
  min-height:16px;
}

/* DESKTOP */

@media(min-width:700px){

  header{
    padding-top:22px;
    padding-bottom:18px;
  }

  .brand-title{font-size:27px}

  main{padding-top:28px}

  #songs{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  #player{
    padding-top:11px;
    padding-bottom:11px;
  }

  body{
    --player-height:215px;
  }
}

/* MOBILE */

@media(max-width:600px){

  .brand-title{font-size:22px}

  .brand-icon{font-size:25px}

  main{
    padding-left:14px;
    padding-right:14px;
  }

  .controls{gap:6px}

  .control-btn{
    width:44px;
    height:44px;
    border-radius:13px;
  }

  .control-btn.main{
    width:56px;
    height:56px;
  }

  .volume-popup{
    right:12px;
    bottom:68px;
  }

  #volume{width:145px}
}

@media(max-width:360px){

  .controls{gap:4px}

  .control-btn{
    width:40px;
    height:40px;
  }

  .control-btn.main{
    width:51px;
    height:51px;
  }

  #volume{width:125px}
}
</style>
</head>

<body>

<header>

  <div class="header-row">

    <div class="brand">
      <div class="brand-icon">♫</div>
      <div class="brand-title">My Music Player</div>
    </div>

    <div class="header-actions">

      <button
        id="searchBtn"
        class="header-btn"
        type="button"
        title="Search"
        aria-label="Search"
        aria-expanded="false"
      >
        <span id="searchIcon" class="header-icon">⌕</span>
      </button>

      <button
        id="themeBtn"
        class="header-btn"
        type="button"
        aria-label="Toggle theme"
        title="Toggle theme"
      >
        <span id="themeIcon" class="header-icon">☼</span>
      </button>

    </div>

  </div>

  <div id="searchWrap" class="search-wrap">

    <input
      id="search"
      type="search"
      placeholder="Search songs..."
      autocomplete="off"
      spellcheck="false"
    >

  </div>

</header>


<main>

  <div class="section-title">
    Folders
  </div>

  <div id="folders"></div>

  <div class="section-title">
    Songs
  </div>

  <div id="songs"></div>

</main>


<section id="player">

  <div class="player-inner">

    <div id="nowPlaying">
      Nothing playing
    </div>

    <div class="progress-row">

      <span id="currentTime" class="time">
        0:00
      </span>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
      >

      <span id="duration" class="time">
        0:00
      </span>

    </div>


    <div class="controls">

      <!-- SHUFFLE -->

      <button
        id="shuffleBtn"
        class="control-btn mode"
        type="button"
        title="Shuffle"
        aria-label="Shuffle"
      >
        <span class="control-icon">⇄</span>
      </button>


      <!-- PREVIOUS -->

      <button
        id="prevBtn"
        class="control-btn"
        type="button"
        title="Previous"
        aria-label="Previous"
      >
        <span class="control-icon">|◀</span>
      </button>


      <!-- PLAY -->

      <button
        id="playBtn"
        class="control-btn main"
        type="button"
        title="Play / Pause"
        aria-label="Play / Pause"
      >
        <span id="playIcon" class="control-icon">▶</span>
      </button>


      <!-- NEXT -->

      <button
        id="nextBtn"
        class="control-btn"
        type="button"
        title="Next"
        aria-label="Next"
      >
        <span class="control-icon">▶|</span>
      </button>


      <!-- REPEAT -->

      <button
        id="repeatBtn"
        class="control-btn mode active"
        type="button"
        title="Repeat All"
        aria-label="Repeat All"
      >
        <span id="repeatIcon" class="control-icon">↻</span>
      </button>


      <!-- VOLUME -->

      <button
        id="volumeBtn"
        class="control-btn mode"
        type="button"
        title="Volume"
        aria-label="Volume"
        aria-expanded="false"
      >
        <span id="volumeBtnIcon" class="control-icon">◖)</span>
      </button>

    </div>


    <!-- COMPACT VOLUME POPUP -->

    <div
      id="volumePopup"
      class="volume-popup"
    >

      <button
        id="volumeIcon"
        class="volume-mute"
        type="button"
        title="Mute / Unmute"
        aria-label="Mute / Unmute"
      >
        <span id="volumeMuteIcon">◖)</span>
      </button>

      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="100"
        step="1"
        title="Volume"
        aria-label="Volume"
      >

    </div>


    <div id="status">
      Ready
    </div>

  </div>

</section>


<audio
  id="audio"
  preload="none"
></audio>


<script>

/* =====================================================
   API
===================================================== */

const API =
  "https://script.google.com/macros/s/AKfycbx__pPoUcKktHd7j78BYa-6Zbxo3WnFfQpHKCW1CuM-4eDRcfTw_5qz5IeLBVY1Jf5f6Q/exec";


/* =====================================================
   STATE
===================================================== */

let library = [];
let currentQueue = [];
let currentIndex = -1;
let currentSong = null;
let currentObjectUrl = null;
let selectedFolder = "All Songs";
let searchText = "";

let favorites =
  JSON.parse(
    localStorage.getItem("musicFavorites") || "[]"
  );

let recentlyPlayed =
  JSON.parse(
    localStorage.getItem("musicRecentlyPlayed") || "[]"
  );

const FAVORITES_FOLDER = "⭐ Favorites";
const RECENT_FOLDER = "🕘 Recently Played";

let repeatMode = 2;
let shuffleMode = false;
let loadRequestId = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const audio =
  document.getElementById("audio");

const songsEl =
  document.getElementById("songs");

const foldersEl =
  document.getElementById("folders");

const searchEl =
  document.getElementById("search");

const searchWrap =
  document.getElementById("searchWrap");

const searchBtn =
  document.getElementById("searchBtn");

const searchIcon =
  document.getElementById("searchIcon");

const nowPlayingEl =
  document.getElementById("nowPlaying");

const progressEl =
  document.getElementById("progress");

const currentTimeEl =
  document.getElementById("currentTime");

const durationEl =
  document.getElementById("duration");

const statusEl =
  document.getElementById("status");

const playBtn =
  document.getElementById("playBtn");

const playIcon =
  document.getElementById("playIcon");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const shuffleBtn =
  document.getElementById("shuffleBtn");

const repeatBtn =
  document.getElementById("repeatBtn");

const repeatIcon =
  document.getElementById("repeatIcon");

const volumeBtn =
  document.getElementById("volumeBtn");

const volumeBtnIcon =
  document.getElementById("volumeBtnIcon");

const volumePopup =
  document.getElementById("volumePopup");

const volumeIcon =
  document.getElementById("volumeIcon");

const volumeMuteIcon =
  document.getElementById("volumeMuteIcon");

const volumeEl =
  document.getElementById("volume");

const themeBtn =
  document.getElementById("themeBtn");

const themeIcon =
  document.getElementById("themeIcon");


/* =====================================================
   JSONP
===================================================== */

function apiJSONP(url){

  return new Promise(
    function(resolve,reject){

      const callbackName =
        "musicCallback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);

      const script =
        document.createElement("script");

      let finished = false;

      const timer =
        setTimeout(
          function(){

            if(finished) return;

            finished = true;

            cleanup();

            reject(
              new Error(
                "Request timed out"
              )
            );

          },
          30000
        );


      function cleanup(){

        clearTimeout(timer);

        delete window[callbackName];

        script.remove();

      }


      window[callbackName] =
        function(data){

          if(finished) return;

          finished = true;

          cleanup();

          resolve(data);

        };


      script.src =
        url +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function(){

          if(finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "API request failed"
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   LOAD LIBRARY
===================================================== */

async function loadLibrary(){

  statusEl.textContent =
    "Loading library...";

  try{

    const data =
      await apiJSONP(
        API +
        "?action=library"
      );


    if(!Array.isArray(data)){

      throw new Error(
        data?.error ||
        "Invalid library response"
      );

    }


    library = data;

    buildFolders();

    updateQueue();

    renderSongs();


    statusEl.textContent =
      library.length +
      " songs";

  }
  catch(error){

    console.error(error);

    statusEl.textContent =
      "Could not load library";

  }

}


/* =====================================================
   FOLDERS
===================================================== */

function buildFolders(){

  const folders = [
    "All Songs",
    FAVORITES_FOLDER,
    RECENT_FOLDER,
    ...new Set(
      library
        .map(song => song.folder)
        .filter(
          folder =>
            folder &&
            folder !== "All Songs"
        )
    )
  ];


  foldersEl.innerHTML = "";


  folders.forEach(
    folder => {

      const button =
        document.createElement("button");

      button.className =
        "folder-btn";


      if(
        folder === selectedFolder
      ){

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        folder;


      button.onclick =
        function(){

          selectedFolder =
            folder;

          buildFolders();

          updateQueue();

          renderSongs();

        };


      foldersEl.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   QUEUE
===================================================== */

function updateQueue(){

  let queue = [];


  if(
    selectedFolder ===
    FAVORITES_FOLDER
  ){

    queue =
      library.filter(
        song =>
          favorites.includes(
            song.id
          )
      );

  }

  else if(
    selectedFolder ===
    RECENT_FOLDER
  ){

    queue =
      recentlyPlayed
        .map(
          id =>
            library.find(
              song =>
                song.id === id
            )
        )
        .filter(
          song => !!song
        );

  }

  else{

    queue =
      library.filter(
        song =>
          selectedFolder ===
            "All Songs" ||
          song.folder ===
            selectedFolder
      );

  }


  if(searchText){

    queue =
      queue.filter(
        song =>
          song.name
            .toLowerCase()
            .includes(
              searchText.toLowerCase()
            )
      );

  }


  currentQueue =
    queue;


  if(currentSong){

    currentIndex =
      currentQueue.findIndex(
        song =>
          song.id ===
          currentSong.id
      );

  }

}


/* =====================================================
   RENDER SONGS
===================================================== */

function renderSongs(){

  songsEl.innerHTML = "";


  if(
    currentQueue.length === 0
  ){

    let message =
      "No songs found";


    if(
      selectedFolder ===
      FAVORITES_FOLDER
    ){

      message =
        "No favorite songs yet";

    }

    else if(
      selectedFolder ===
      RECENT_FOLDER
    ){

      message =
        "No recently played songs yet";

    }


    songsEl.innerHTML =
      `<div class="empty">${message}</div>`;

    return;

  }


  currentQueue.forEach(
    (song,index) => {

      const row =
        document.createElement("div");

      row.className =
        "song-row";


      if(
        currentSong &&
        currentSong.id ===
        song.id
      ){

        row.classList.add(
          "active"
        );

      }


      const number =
        document.createElement("div");

      number.className =
        "song-number";

      number.textContent =
        index + 1;


      const name =
        document.createElement("div");

      name.className =
        "song-name";

      name.textContent =
        song.name;


      const favorite =
        document.createElement("button");

      favorite.className =
        "favorite-btn";

      favorite.type =
        "button";


      const isFavorite =
        favorites.includes(
          song.id
        );


      favorite.textContent =
        isFavorite
          ? "♥"
          : "♡";


      if(isFavorite){

        favorite.classList.add(
          "active"
        );

      }


      favorite.onclick =
        function(event){

          event.stopPropagation();

          toggleFavorite(
            song.id
          );

        };


      row.appendChild(
        number
      );

      row.appendChild(
        name
      );

      row.appendChild(
        favorite
      );


      row.onclick =
        function(){

          playSongByIndex(
            index
          );

        };


      songsEl.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   FAVORITES
===================================================== */

function toggleFavorite(id){

  if(
    favorites.includes(id)
  ){

    favorites =
      favorites.filter(
        item =>
          item !== id
      );

  }
  else{

    favorites.push(id);

  }


  localStorage.setItem(
    "musicFavorites",
    JSON.stringify(
      favorites
    )
  );


  updateQueue();

  renderSongs();

}


/* =====================================================
   RECENTLY PLAYED
===================================================== */

function addToRecentlyPlayed(song){

  if(
    !song ||
    !song.id
  ){

    return;

  }


  recentlyPlayed =
    recentlyPlayed.filter(
      id =>
        id !== song.id
    );


  recentlyPlayed.unshift(
    song.id
  );


  recentlyPlayed =
    recentlyPlayed.slice(
      0,
      20
    );


  localStorage.setItem(
    "musicRecentlyPlayed",
    JSON.stringify(
      recentlyPlayed
    )
  );


  if(
    selectedFolder ===
    RECENT_FOLDER
  ){

    updateQueue();

    renderSongs();

  }

}


/* =====================================================
   PLAY SONG
===================================================== */

async function playSongByIndex(index){

  if(
    index < 0 ||
    index >= currentQueue.length
  ){

    return;

  }


  currentIndex =
    index;


  const song =
    currentQueue[index];


  currentSong =
    song;


  renderSongs();


  const requestId =
    ++loadRequestId;


  statusEl.textContent =
    "Loading...";


  nowPlayingEl.textContent =
    song.name;


  audio.pause();


  if(currentObjectUrl){

    URL.revokeObjectURL(
      currentObjectUrl
    );

    currentObjectUrl =
      null;

  }


  audio.removeAttribute(
    "src"
  );

  audio.load();


  try{

    const data =
      await apiJSONP(
        API +
        "?action=song&id=" +
        encodeURIComponent(
          song.id
        )
      );


    if(
      requestId !==
      loadRequestId
    ){

      return;

    }


    if(
      !data ||
      !data.base64
    ){

      throw new Error(
        data?.error ||
        "Song data missing"
      );

    }


    const binary =
      atob(
        data.base64
      );


    const bytes =
      new Uint8Array(
        binary.length
      );


    for(
      let i = 0;
      i < binary.length;
      i++
    ){

      bytes[i] =
        binary.charCodeAt(i);

    }


    if(
      requestId !==
      loadRequestId
    ){

      return;

    }


    const blob =
      new Blob(
        [bytes],
        {
          type:
            data.type ||
            "audio/mpeg"
        }
      );


    currentObjectUrl =
      URL.createObjectURL(
        blob
      );


    audio.src =
      currentObjectUrl;


    audio.load();


    if(
      requestId !==
      loadRequestId
    ){

      return;

    }


    await audio.play();


    if(
      requestId !==
      loadRequestId
    ){

      audio.pause();

      return;

    }


    addToRecentlyPlayed(
      song
    );


    statusEl.textContent =
      "Playing";

  }
  catch(error){

    if(
      requestId !==
      loadRequestId
    ){

      return;

    }


    console.error(error);

    statusEl.textContent =
      "Could not play song";

  }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

playBtn.onclick =
  async function(){

    if(!currentSong){

      if(
        currentQueue.length > 0
      ){

        await playSongByIndex(
          0
        );

      }

      return;

    }


    if(
      audio.src &&
      !audio.paused
    ){

      audio.pause();

    }

    else{

      try{

        await audio.play();

      }
      catch(error){

        console.error(error);

      }

    }

  };


audio.addEventListener(
  "play",
  function(){

    playIcon.textContent =
      "Ⅱ";

    statusEl.textContent =
      "Playing";

  }
);


audio.addEventListener(
  "pause",
  function(){

    playIcon.textContent =
      "▶";


    if(
      currentSong &&
      audio.currentTime > 0 &&
      !audio.ended
    ){

      statusEl.textContent =
        "Paused";

    }

  }
);


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

  if(
    currentQueue.length === 0
  ){

    return;

  }


  let nextIndex;


  if(shuffleMode){

    if(
      currentQueue.length === 1
    ){

      nextIndex = 0;

    }

    else{

      do{

        nextIndex =
          Math.floor(
            Math.random() *
            currentQueue.length
          );

      }
      while(
        nextIndex ===
        currentIndex
      );

    }

  }

  else{

    nextIndex =
      currentIndex + 1;


    if(
      nextIndex >=
      currentQueue.length
    ){

      if(
        repeatMode === 2
      ){

        nextIndex = 0;

      }

      else{

        audio.pause();

        audio.currentTime = 0;

        statusEl.textContent =
          "Finished";

        return;

      }

    }

  }


  playSongByIndex(
    nextIndex
  );

}


nextBtn.onclick =
  nextSong;


/* =====================================================
   PREVIOUS
===================================================== */

prevBtn.onclick =
  function(){

    if(
      currentQueue.length === 0
    ){

      return;

    }


    if(
      audio.currentTime > 3
    ){

      audio.currentTime = 0;

      return;

    }


    let previousIndex =
      currentIndex - 1;


    if(
      previousIndex < 0
    ){

      previousIndex =
        currentQueue.length - 1;

    }


    playSongByIndex(
      previousIndex
    );

  };


/* =====================================================
   SONG ENDED
===================================================== */

audio.addEventListener(
  "ended",
  function(){

    if(
      repeatMode === 1
    ){

      audio.currentTime = 0;

      audio.play();

      return;

    }


    nextSong();

  }
);


/* =====================================================
   SHUFFLE
===================================================== */

shuffleBtn.onclick =
  function(){

    shuffleMode =
      !shuffleMode;


    shuffleBtn.classList.toggle(
      "active",
      shuffleMode
    );


    shuffleBtn.title =
      shuffleMode
        ? "Shuffle On"
        : "Shuffle Off";


    statusEl.textContent =
      shuffleMode
        ? "Shuffle On"
        : "Shuffle Off";

  };


/* =====================================================
   REPEAT
===================================================== */

repeatBtn.onclick =
  function(){

    if(
      repeatMode === 2
    ){

      repeatMode = 1;

    }

    else if(
      repeatMode === 1
    ){

      repeatMode = 0;

    }

    else{

      repeatMode = 2;

    }


    updateRepeatUI();

  };


function updateRepeatUI(){

  repeatBtn.classList.toggle(
    "active",
    repeatMode !== 0
  );


  if(
    repeatMode === 2
  ){

    repeatIcon.textContent =
      "↻";

    repeatBtn.title =
      "Repeat All";

  }

  else if(
    repeatMode === 1
  ){

    repeatIcon.textContent =
      "↻¹";

    repeatBtn.title =
      "Repeat One";

  }

  else{

    repeatIcon.textContent =
      "↻";

    repeatBtn.title =
      "Repeat Off";

  }

}


updateRepeatUI();


/* =====================================================
   VOLUME
===================================================== */

function updateVolumeUI(){

  const value =
    Number(
      volumeEl.value
    );


  let icon;


  if(
    value === 0
  ){

    icon =
      "×";

  }

  else if(
    value < 50
  ){

    icon =
      "◖)";

  }

  else{

    icon =
      "◖))";

  }


  /*
    Same plain text symbols are used
    everywhere.

    This prevents yellow emoji.
  */

  volumeBtnIcon.textContent =
    icon;

  volumeMuteIcon.textContent =
    icon;


  /*
    THIS creates the visible filled bar.
  */

  volumeEl.style.background =
    `linear-gradient(
      to right,
      var(--accent) 0%,
      var(--accent) ${value}%,
      var(--surface-3) ${value}%,
      var(--surface-3) 100%
    )`;

}


const savedVolume =
  localStorage.getItem(
    "musicVolume"
  );


if(
  savedVolume !== null
){

  const volume =
    Math.min(
      100,
      Math.max(
        0,
        Number(savedVolume)
      )
    );


  audio.volume =
    volume / 100;


  volumeEl.value =
    volume;

}

else{

  audio.volume =
    1;

}


updateVolumeUI();


/*
  Open / close volume popup.
*/

volumeBtn.onclick =
  function(event){

    event.stopPropagation();


    const open =
      volumePopup.classList.toggle(
        "open"
      );


    volumeBtn.classList.toggle(
      "active",
      open
    );


    volumeBtn.setAttribute(
      "aria-expanded",
      String(open)
    );

  };


/*
  Slider.
*/

volumeEl.addEventListener(
  "input",
  function(){

    const volume =
      Number(
        volumeEl.value
      );


    audio.volume =
      volume / 100;


    localStorage.setItem(
      "musicVolume",
      String(volume)
    );


    if(
      volume > 0
    ){

      localStorage.setItem(
        "previousVolume",
        String(volume)
      );

    }


    updateVolumeUI();

  }
);


/*
  Mute / unmute.
*/

volumeIcon.onclick =
  function(){

    if(
      audio.volume > 0
    ){

      localStorage.setItem(
        "previousVolume",
        volumeEl.value
      );


      audio.volume =
        0;


      volumeEl.value =
        0;

    }

    else{

      const previous =
        Number(
          localStorage.getItem(
            "previousVolume"
          ) || "100"
        );


      audio.volume =
        previous / 100;


      volumeEl.value =
        previous;


      localStorage.setItem(
        "musicVolume",
        String(previous)
      );

    }


    updateVolumeUI();

  };


/*
  Don't close popup when clicking
  inside it.
*/

volumePopup.onclick =
  function(event){

    event.stopPropagation();

  };


/*
  Close popup when clicking elsewhere.
*/

document.addEventListener(
  "click",
  function(){

    volumePopup.classList.remove(
      "open"
    );

    volumeBtn.classList.remove(
      "active"
    );

    volumeBtn.setAttribute(
      "aria-expanded",
      "false"
    );

  }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
  "loadedmetadata",
  function(){

    if(
      Number.isFinite(
        audio.duration
      )
    ){

      durationEl.textContent =
        formatTime(
          audio.duration
        );

    }

  }
);


audio.addEventListener(
  "timeupdate",
  function(){

    if(
      !Number.isFinite(
        audio.duration
      )
    ){

      return;

    }


    const percent =
      (
        audio.currentTime /
        audio.duration
      ) * 100;


    progressEl.value =
      percent;


    progressEl.style.background =
      `linear-gradient(
        to right,
        var(--accent) 0%,
        var(--accent) ${percent}%,
        var(--surface-3) ${percent}%,
        var(--surface-3) 100%
      )`;


    currentTimeEl.textContent =
      formatTime(
        audio.currentTime
      );

  }
);


progressEl.oninput =
  function(){

    if(
      Number.isFinite(
        audio.duration
      )
    ){

      audio.currentTime =
        (
          Number(
            progressEl.value
          ) / 100
        ) *
        audio.duration;

    }

  };


function formatTime(seconds){

  if(
    !Number.isFinite(seconds)
  ){

    return "0:00";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    Math.floor(
      seconds % 60
    );


  return (
    minutes +
    ":" +
    String(
      remaining
    ).padStart(
      2,
      "0"
    )
  );

}


/* =====================================================
   SEARCH
===================================================== */

searchBtn.onclick =
  function(event){

    event.stopPropagation();


    const open =
      searchWrap.classList.toggle(
        "open"
      );


    searchBtn.classList.toggle(
      "active",
      open
    );


    searchBtn.setAttribute(
      "aria-expanded",
      String(open)
    );


    searchIcon.textContent =
      open
        ? "×"
        : "⌕";


    if(open){

      searchEl.focus();

    }

    else{

      searchEl.value =
        "";

      searchText =
        "";

      updateQueue();

      renderSongs();

    }

  };


searchEl.addEventListener(
  "input",
  function(){

    searchText =
      searchEl.value.trim();


    updateQueue();

    renderSongs();

  }
);


searchEl.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      searchBtn.click();

    }

  }
);


/* =====================================================
   THEME
===================================================== */

const savedTheme =
  localStorage.getItem(
    "musicTheme"
  );


if(
  savedTheme === "light"
){

  document.body.classList.add(
    "light"
  );

}


function updateThemeIcon(){

  const light =
    document.body.classList.contains(
      "light"
    );


  themeIcon.textContent =
    light
      ? "☾"
      : "☼";

}


themeBtn.onclick =
  function(){

    document.body.classList.toggle(
      "light"
    );


    const light =
      document.body.classList.contains(
        "light"
      );


    localStorage.setItem(
      "musicTheme",
      light
        ? "light"
        : "dark"
    );


    updateThemeIcon();

  };


updateThemeIcon();


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register("./sw.js")
        .catch(
          error =>
            console.log(
              "Service worker:",
              error
            )
        );

    }
  );

}


/* =====================================================
   START
===================================================== */

loadLibrary();

</script>
