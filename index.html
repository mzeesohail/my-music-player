<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0b0d"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <link rel="manifest" href="./manifest.json">

  <title>My Music Player</title>

  <style>

    :root {
      --bg: #09090b;
      --surface: #111114;
      --surface-2: #18181c;
      --surface-3: #202025;

      --text: #f5f5f7;
      --text-soft: #a7a7ad;
      --border: rgba(255,255,255,0.08);

      --accent: #9b5cff;
      --accent-2: #7c3aed;

      --shadow:
        0 12px 35px rgba(0,0,0,0.35);

      --player-height: 270px;
    }

    body.light {
      --bg: #f6f6f8;
      --surface: #ffffff;
      --surface-2: #f0f0f3;
      --surface-3: #e7e7eb;

      --text: #111114;
      --text-soft: #66666d;
      --border: rgba(0,0,0,0.08);

      --shadow:
        0 12px 30px rgba(0,0,0,0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      padding-bottom: calc(var(--player-height) + 25px);
      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 20;

      background:
        linear-gradient(
          180deg,
          var(--surface),
          rgba(17,17,20,0.96)
        );

      border-bottom: 1px solid var(--border);

      padding:
        18px
        max(18px, env(safe-area-inset-right))
        16px
        max(18px, env(safe-area-inset-left));

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    body.light header {
      background:
        rgba(255,255,255,0.92);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -0.5px;

      background:
        linear-gradient(
          90deg,
          var(--text),
          var(--accent)
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      white-space: nowrap;
    }

    .theme-btn {
      width: 48px;
      height: 48px;

      border-radius: 50%;
      border: 1px solid var(--border);

      background: var(--surface-2);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 5px 18px rgba(0,0,0,0.18);

      transition:
        transform 0.15s ease,
        background 0.2s ease;
    }

    .theme-btn:active {
      transform: scale(0.93);
    }

    .theme-icon {
      font-size: 21px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      max-width: 1100px;
      margin: 18px auto 0;
    }

    #search {
      width: 100%;

      padding: 16px 18px;

      border-radius: 17px;

      border: 1px solid var(--border);

      outline: none;

      background: var(--surface-2);

      color: var(--text);

      font-size: 18px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.035);

      transition:
        border 0.2s ease,
        box-shadow 0.2s ease;
    }

    #search::placeholder {
      color: var(--text-soft);
    }

    #search:focus {
      border-color: rgba(155,92,255,0.55);

      box-shadow:
        0 0 0 3px rgba(155,92,255,0.10);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1100px;
      margin: auto;
      padding: 22px 18px 30px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 650;
      margin: 14px 0 13px;
      color: var(--text-soft);
    }

    /* =========================
       FOLDERS
    ========================= */

    #folders {
      display: flex;
      gap: 10px;

      overflow-x: auto;

      padding-bottom: 5px;

      scrollbar-width: none;
    }

    #folders::-webkit-scrollbar {
      display: none;
    }

    .folder-btn {
      flex: 0 0 auto;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          var(--surface-3),
          var(--surface-2)
        );

      color: var(--text-soft);

      padding: 10px 17px;

      border-radius: 999px;

      cursor: pointer;

      white-space: nowrap;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 4px 14px rgba(0,0,0,0.10);

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border 0.2s ease,
        transform 0.15s ease;
    }

    .folder-btn:active {
      transform: scale(0.96);
    }

    .folder-btn.active {
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      border-color: transparent;

      box-shadow:
        0 5px 18px rgba(124,58,237,0.24);
    }

    /* =========================
       SONG LIST
    ========================= */

    #songs {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .song-row {
      display: flex;
      align-items: center;
      gap: 12px;

      min-height: 68px;

      padding: 10px 13px;

      border-radius: 16px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          var(--surface-2),
          var(--surface)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.025);

      cursor: pointer;

      transition:
        transform 0.12s ease,
        border 0.2s ease,
        background 0.2s ease;
    }

    .song-row:active {
      transform: scale(0.99);
    }

    .song-row.active {
      border-color: rgba(155,92,255,0.45);

      background:
        linear-gradient(
          145deg,
          rgba(155,92,255,0.16),
          var(--surface-2)
        );

      box-shadow:
        inset 3px 0 0 var(--accent),
        0 7px 22px rgba(0,0,0,0.16);
    }

    .song-number {
      width: 28px;

      text-align: center;

      color: var(--text-soft);

      font-size: 16px;

      flex-shrink: 0;
    }

    .song-row.active .song-number {
      color: var(--accent);
      font-weight: 700;
    }

    .song-name {
      flex: 1;

      min-width: 0;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      font-size: 16px;
    }

    .favorite-btn {
      width: 38px;
      height: 38px;

      border: 0;
      background: transparent;

      color: var(--text-soft);

      font-size: 24px;

      cursor: pointer;

      flex-shrink: 0;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .favorite-btn.active {
      color: var(--accent);
    }

    .empty {
      text-align: center;

      padding: 45px 20px;

      color: var(--text-soft);
    }

    /* =========================
       PLAYER
    ========================= */

    #player {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 50;

      background:
        linear-gradient(
          180deg,
          rgba(18,18,21,0.97),
          rgba(8,8,10,0.99)
        );

      border-top: 1px solid var(--border);

      padding:
        15px
        max(18px, env(safe-area-inset-right))
        max(17px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 -12px 35px rgba(0,0,0,0.25);
    }

    body.light #player {
      background:
        rgba(255,255,255,0.96);
    }

    .player-inner {
      max-width: 900px;
      margin: auto;
    }

    #nowPlaying {
      text-align: center;

      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      margin-bottom: 11px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .time {
      width: 40px;

      font-size: 12px;

      color: var(--text-soft);

      text-align: center;
    }

    #progress {
      flex: 1;

      height: 5px;

      appearance: none;
      -webkit-appearance: none;

      border-radius: 99px;

      background: var(--surface-3);

      outline: none;

      cursor: pointer;
    }

    #progress::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 15px;
      height: 15px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 4px rgba(155,92,255,0.12);
    }

    #progress::-moz-range-thumb {
      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background: var(--accent);
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      margin-top: 14px;
    }

    .control-btn {
      position: relative;

      width: 52px;
      height: 52px;

      border-radius: 16px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          var(--surface-3),
          var(--surface-2)
        );

      color: var(--text);

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 5px 16px rgba(0,0,0,0.15);

      transition:
        transform 0.12s ease,
        color 0.2s ease,
        border 0.2s ease,
        background 0.2s ease;
    }

    .control-btn:active {
      transform: scale(0.92);
    }

    .control-btn.main {
      width: 64px;
      height: 64px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          var(--accent),
          var(--accent-2)
        );

      border-color: transparent;

      color: white;

      box-shadow:
        0 8px 25px rgba(124,58,237,0.30);
    }

    .control-btn.mode.active {
      color: var(--accent);

      border-color:
        rgba(155,92,255,0.45);

      background:
        rgba(155,92,255,0.10);
    }

    .control-icon {
      font-size: 21px;
      line-height: 1;
    }

    .main .control-icon {
      font-size: 25px;
    }

    .mode-label {
      position: absolute;

      right: 7px;
      bottom: 5px;

      font-size: 8px;

      font-weight: 700;

      color: var(--accent);
    }

    #status {
      text-align: center;

      color: var(--text-soft);

      font-size: 12px;

      margin-top: 8px;

      min-height: 16px;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {

      header {
        padding-top: 22px;
        padding-bottom: 18px;
      }

      .brand-title {
        font-size: 27px;
      }

      main {
        padding-top: 28px;
      }

      #songs {
        display: grid;

        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

      .song-row {
        min-width: 0;
      }

      #player {
        padding-top: 13px;
        padding-bottom: 13px;
      }

      body {
        --player-height: 220px;
      }
    }

    @media (max-width: 430px) {

      .brand-title {
        font-size: 22px;
      }

      .theme-btn {
        width: 44px;
        height: 44px;
      }

      main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .controls {
        gap: 7px;
      }

      .control-btn {
        width: 47px;
        height: 47px;
        border-radius: 14px;
      }

      .control-btn.main {
        width: 60px;
        height: 60px;
      }

      .control-icon {
        font-size: 19px;
      }

      .main .control-icon {
        font-size: 23px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="header-row">

      <div class="brand">

        <div class="brand-icon">♫</div>

        <div class="brand-title">
          My Music Player
        </div>

      </div>

      <button
        id="themeBtn"
        class="theme-btn"
        aria-label="Toggle theme"
        title="Toggle theme"
      >
        <span
          id="themeIcon"
          class="theme-icon"
        >☼</span>
      </button>

    </div>

    <div class="search-wrap">

      <input
        id="search"
        type="search"
        placeholder="Search songs..."
        autocomplete="off"
        spellcheck="false"
      >

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <div class="section-title">
      Folders
    </div>

    <div id="folders"></div>

    <div class="section-title">
      Songs
    </div>

    <div id="songs"></div>

  </main>


  <!-- =========================
       PLAYER
  ========================== -->

  <section id="player">

    <div class="player-inner">

      <div id="nowPlaying">
        Nothing playing
      </div>

      <div class="progress-row">

        <span
          id="currentTime"
          class="time"
        >
          0:00
        </span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <span
          id="duration"
          class="time"
        >
          0:00
        </span>

      </div>

      <div class="controls">

        <!-- Shuffle -->

        <button
          id="shuffleBtn"
          class="control-btn mode"
          title="Shuffle"
          aria-label="Shuffle"
        >

          <span class="control-icon">
            ⤨
          </span>

        </button>


        <!-- Previous -->

        <button
          id="prevBtn"
          class="control-btn"
          title="Previous"
          aria-label="Previous"
        >

          <span class="control-icon">
            |◀
          </span>

        </button>


        <!-- Play -->

        <button
          id="playBtn"
          class="control-btn main"
          title="Play / Pause"
          aria-label="Play / Pause"
        >

          <span
            id="playIcon"
            class="control-icon"
          >
            ▶
          </span>

        </button>


        <!-- Next -->

        <button
          id="nextBtn"
          class="control-btn"
          title="Next"
          aria-label="Next"
        >

          <span class="control-icon">
            ▶|
          </span>

        </button>


        <!-- Repeat -->

        <button
          id="repeatBtn"
          class="control-btn mode"
          title="Repeat All"
          aria-label="Repeat All"
        >

          <span class="control-icon">
            ↻
          </span>

          <span
            id="repeatLabel"
            class="mode-label"
          >
            ALL
          </span>

        </button>

      </div>

      <div id="status">
        Ready
      </div>

    </div>

  </section>


  <!-- Actual audio element -->

  <audio
    id="audio"
    preload="none"
  ></audio>


  <script>

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const API =
      "https://script.google.com/macros/s/AKfycbx__pPoUcKktHd7j78BYa-6Zbxo3WnFfQpHKCW1CuM-4eDRcfTw_5qz5IeLBVY1Jf5f6Q/exec";


    /* =====================================================
       STATE
    ===================================================== */

    let library = [];

    let currentQueue = [];

    let currentIndex = -1;

    let currentSong = null;

    let currentObjectUrl = null;

    let selectedFolder = "All Songs";

    let searchText = "";

    let favorites =
      JSON.parse(
        localStorage.getItem("musicFavorites") || "[]"
      );


    /*
      0 = off
      1 = repeat one
      2 = repeat all

      IMPORTANT:
      Repeat All is the DEFAULT.

      This means:

      1 → 2 → 3 → 1 → 2 → 3
    */

    let repeatMode = 2;

    let shuffleMode = false;


    /*
      Every time the user requests another song,
      this number increases.

      Only the newest request is allowed to
      actually start playback.

      This fixes:

      click 1
      click 2
      click 3
      click 1

      where an old request could finish later
      and unexpectedly start playing.
    */

    let loadRequestId = 0;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const audio =
      document.getElementById("audio");

    const songsEl =
      document.getElementById("songs");

    const foldersEl =
      document.getElementById("folders");

    const searchEl =
      document.getElementById("search");

    const nowPlayingEl =
      document.getElementById("nowPlaying");

    const progressEl =
      document.getElementById("progress");

    const currentTimeEl =
      document.getElementById("currentTime");

    const durationEl =
      document.getElementById("duration");

    const statusEl =
      document.getElementById("status");

    const playBtn =
      document.getElementById("playBtn");

    const playIcon =
      document.getElementById("playIcon");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const shuffleBtn =
      document.getElementById("shuffleBtn");

    const repeatBtn =
      document.getElementById("repeatBtn");

    const repeatLabel =
      document.getElementById("repeatLabel");

    const themeBtn =
      document.getElementById("themeBtn");

    const themeIcon =
      document.getElementById("themeIcon");


    /* =====================================================
       JSONP API
    ===================================================== */

    function apiJSONP(url) {

      return new Promise(
        function(resolve, reject) {

          const callbackName =
            "musicCallback_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .slice(2);

          const script =
            document.createElement("script");

          let finished = false;

          const timer =
            setTimeout(
              function() {

                if (finished) return;

                finished = true;

                cleanup();

                reject(
                  new Error(
                    "Request timed out"
                  )
                );

              },
              30000
            );


          function cleanup() {

            clearTimeout(timer);

            delete window[callbackName];

            script.remove();

          }


          window[callbackName] =
            function(data) {

              if (finished) return;

              finished = true;

              cleanup();

              resolve(data);

            };


          script.src =
            url +
            "&callback=" +
            encodeURIComponent(
              callbackName
            );


          script.onerror =
            function() {

              if (finished) return;

              finished = true;

              cleanup();

              reject(
                new Error(
                  "API request failed"
                )
              );

            };


          document.body.appendChild(
            script
          );

        }
      );

    }


    /* =====================================================
       LOAD LIBRARY
    ===================================================== */

    async function loadLibrary() {

      statusEl.textContent =
        "Loading library...";

      try {

        const data =
          await apiJSONP(
            API +
            "?action=library"
          );


        if (!Array.isArray(data)) {

          throw new Error(
            data?.error ||
            "Invalid library response"
          );

        }


        library = data;


        buildFolders();

        updateQueue();

        renderSongs();


        statusEl.textContent =
          library.length +
          " songs";


      }
      catch (error) {

        console.error(error);

        statusEl.textContent =
          "Could not load library";

      }

    }


    /* =====================================================
       FOLDERS
    ===================================================== */

    function buildFolders() {

      const folders =
        [
          "All Songs",
          ...new Set(
            library
              .map(song => song.folder)
              .filter(
                folder =>
                  folder &&
                  folder !== "All Songs"
              )
          )
        ];


      foldersEl.innerHTML = "";


      folders.forEach(
        folder => {

          const button =
            document.createElement("button");

          button.className =
            "folder-btn";


          if (
            folder === selectedFolder
          ) {

            button.classList.add(
              "active"
            );

          }


          button.textContent =
            folder;


          button.onclick =
            function() {

              selectedFolder =
                folder;

              buildFolders();

              updateQueue();

              renderSongs();

            };


          foldersEl.appendChild(
            button
          );

        }
      );

    }


    /* =====================================================
       FILTER QUEUE
    ===================================================== */

    function updateQueue() {

      let queue =
        library.filter(
          song => {

            const folderMatch =
              selectedFolder ===
              "All Songs" ||
              song.folder ===
              selectedFolder;


            const searchMatch =
              !searchText ||
              song.name
                .toLowerCase()
                .includes(
                  searchText
                    .toLowerCase()
                );


            return (
              folderMatch &&
              searchMatch
            );

          }
        );


      currentQueue = queue;


      /*
        If the currently playing song is
        still in the queue, update its index.
      */

      if (currentSong) {

        const newIndex =
          currentQueue.findIndex(
            song =>
              song.id ===
              currentSong.id
          );


        currentIndex =
          newIndex;

      }

    }


    /* =====================================================
       RENDER SONGS
    ===================================================== */

    function renderSongs() {

      songsEl.innerHTML = "";


      if (
        currentQueue.length === 0
      ) {

        songsEl.innerHTML =
          `
          <div class="empty">
            No songs found
          </div>
          `;

        return;

      }


      currentQueue.forEach(
        (song, index) => {

          const row =
            document.createElement("div");

          row.className =
            "song-row";


          if (
            currentSong &&
            currentSong.id ===
            song.id
          ) {

            row.classList.add(
              "active"
            );

          }


          const number =
            document.createElement("div");

          number.className =
            "song-number";

          number.textContent =
            index + 1;


          const name =
            document.createElement("div");

          name.className =
            "song-name";

          name.textContent =
            song.name;


          const favorite =
            document.createElement("button");

          favorite.className =
            "favorite-btn";


          const isFavorite =
            favorites.includes(
              song.id
            );


          favorite.textContent =
            isFavorite
              ? "♥"
              : "♡";


          if (isFavorite) {

            favorite.classList.add(
              "active"
            );

          }


          favorite.title =
            "Favorite";


          favorite.onclick =
            function(event) {

              event.stopPropagation();

              toggleFavorite(
                song.id
              );

            };


          row.appendChild(
            number
          );

          row.appendChild(
            name
          );

          row.appendChild(
            favorite
          );


          row.onclick =
            function() {

              playSongByIndex(
                index
              );

            };


          songsEl.appendChild(
            row
          );

        }
      );

    }


    /* =====================================================
       FAVORITES
    ===================================================== */

    function toggleFavorite(id) {

      if (
        favorites.includes(id)
      ) {

        favorites =
          favorites.filter(
            item => item !== id
          );

      }
      else {

        favorites.push(id);

      }


      localStorage.setItem(
        "musicFavorites",
        JSON.stringify(
          favorites
        )
      );


      renderSongs();

    }


    /* =====================================================
       PLAY SONG
    ===================================================== */

    async function playSongByIndex(
      index
    ) {

      if (
        index < 0 ||
        index >= currentQueue.length
      ) {

        return;

      }


      currentIndex =
        index;


      const song =
        currentQueue[index];


      currentSong =
        song;


      renderSongs();


      /*
        Increase request ID.

        Any older request that is still
        downloading becomes invalid.
      */

      const requestId =
        ++loadRequestId;


      statusEl.textContent =
        "Loading...";


      nowPlayingEl.textContent =
        song.name;


      /*
        Stop the current audio immediately.
      */

      audio.pause();


      /*
        Remove old object URL.
      */

      if (currentObjectUrl) {

        URL.revokeObjectURL(
          currentObjectUrl
        );

        currentObjectUrl =
          null;

      }


      audio.removeAttribute(
        "src"
      );

      audio.load();


      try {

        const data =
          await apiJSONP(
            API +
            "?action=song&id=" +
            encodeURIComponent(
              song.id
            )
          );


        /*
          VERY IMPORTANT:

          If the user clicked another song
          while this request was running,
          this response is now obsolete.

          Do absolutely nothing with it.
        */

        if (
          requestId !==
          loadRequestId
        ) {

          return;

        }


        if (
          !data ||
          !data.base64
        ) {

          throw new Error(
            data?.error ||
            "Song data missing"
          );

        }


        /*
          Decode Base64.
        */

        const binary =
          atob(data.base64);


        /*
          Check again after decoding.

          Decoding a large song can take
          some time on mobile.
        */

        if (
          requestId !==
          loadRequestId
        ) {

          return;

        }


        const bytes =
          new Uint8Array(
            binary.length
          );


        for (
          let i = 0;
          i < binary.length;
          i++
        ) {

          bytes[i] =
            binary.charCodeAt(i);

        }


        /*
          Check one more time.
        */

        if (
          requestId !==
          loadRequestId
        ) {

          return;

        }


        const blob =
          new Blob(
            [bytes],
            {
              type:
                data.type ||
                "audio/mpeg"
            }
          );


        currentObjectUrl =
          URL.createObjectURL(
            blob
          );


        audio.src =
          currentObjectUrl;


        audio.load();


        /*
          Final stale-request protection.
        */

        if (
          requestId !==
          loadRequestId
        ) {

          return;

        }


        await audio.play();


        if (
          requestId !==
          loadRequestId
        ) {

          audio.pause();

          return;

        }


        statusEl.textContent =
          "Playing";

      }
      catch (error) {

        /*
          Ignore errors from old requests.
        */

        if (
          requestId !==
          loadRequestId
        ) {

          return;

        }


        console.error(error);

        statusEl.textContent =
          "Could not play song";

      }

    }


    /* =====================================================
       PLAY / PAUSE
    ===================================================== */

    playBtn.onclick =
      async function() {

        if (!currentSong) {

          if (
            currentQueue.length > 0
          ) {

            await playSongByIndex(
              0
            );

          }

          return;

        }


        if (
          audio.src &&
          !audio.paused
        ) {

          audio.pause();

        }
        else {

          try {

            await audio.play();

          }
          catch (error) {

            console.error(error);

          }

        }

      };


    audio.addEventListener(
      "play",
      function() {

        playIcon.textContent =
          "Ⅱ";

        statusEl.textContent =
          "Playing";

      }
    );


    audio.addEventListener(
      "pause",
      function() {

        playIcon.textContent =
          "▶";

        if (
          currentSong &&
          audio.currentTime > 0 &&
          !audio.ended
        ) {

          statusEl.textContent =
            "Paused";

        }

      }
    );


    /* =====================================================
       NEXT
    ===================================================== */

    function nextSong() {

      if (
        currentQueue.length === 0
      ) {

        return;

      }


      let nextIndex;


      /*
        SHUFFLE
      */

      if (shuffleMode) {

        if (
          currentQueue.length === 1
        ) {

          nextIndex = 0;

        }
        else {

          do {

            nextIndex =
              Math.floor(
                Math.random() *
                currentQueue.length
              );

          }
          while (
            nextIndex ===
            currentIndex
          );

        }

      }

      /*
        NORMAL
      */

      else {

        nextIndex =
          currentIndex + 1;


        if (
          nextIndex >=
          currentQueue.length
        ) {

          /*
            Repeat All is the default.

            1 → 2 → 3 → 1
          */

          if (
            repeatMode === 2
          ) {

            nextIndex = 0;

          }
          else {

            /*
              Repeat OFF:

              stop at the end.
            */

            audio.pause();

            audio.currentTime = 0;

            statusEl.textContent =
              "Finished";

            return;

          }

        }

      }


      playSongByIndex(
        nextIndex
      );

    }


    nextBtn.onclick =
      nextSong;


    /* =====================================================
       PREVIOUS
    ===================================================== */

    prevBtn.onclick =
      function() {

        if (
          currentQueue.length === 0
        ) {

          return;

        }


        /*
          If song has already played more
          than 3 seconds, restart it first.
        */

        if (
          audio.currentTime > 3
        ) {

          audio.currentTime = 0;

          return;

        }


        let previousIndex =
          currentIndex - 1;


        if (
          previousIndex < 0
        ) {

          previousIndex =
            currentQueue.length - 1;

        }


        playSongByIndex(
          previousIndex
        );

      };


    /* =====================================================
       SONG ENDED
    ===================================================== */

    audio.addEventListener(
      "ended",
      function() {

        if (
          repeatMode === 1
        ) {

          /*
            Repeat One
          */

          audio.currentTime = 0;

          audio.play();

          return;

        }


        /*
          Repeat All or Shuffle
          uses nextSong().
        */

        nextSong();

      }
    );


    /* =====================================================
       SHUFFLE
    ===================================================== */

    shuffleBtn.onclick =
      function() {

        shuffleMode =
          !shuffleMode;


        shuffleBtn.classList.toggle(
          "active",
          shuffleMode
        );


        shuffleBtn.title =
          shuffleMode
            ? "Shuffle On"
            : "Shuffle Off";


        shuffleBtn.setAttribute(
          "aria-label",
          shuffleMode
            ? "Shuffle On"
            : "Shuffle Off"
        );


        statusEl.textContent =
          shuffleMode
            ? "Shuffle On"
            : "Shuffle Off";

      };


    /* =====================================================
       REPEAT
    ===================================================== */

    repeatBtn.onclick =
      function() {

        /*
          Cycle:

          ALL → ONE → OFF → ALL
        */

        if (
          repeatMode === 2
        ) {

          repeatMode = 1;

        }
        else if (
          repeatMode === 1
        ) {

          repeatMode = 0;

        }
        else {

          repeatMode = 2;

        }


        updateRepeatUI();

      };


    function updateRepeatUI() {

      repeatBtn.classList.toggle(
        "active",
        repeatMode !== 0
      );


      if (
        repeatMode === 2
      ) {

        repeatLabel.textContent =
          "ALL";

        repeatBtn.title =
          "Repeat All";

        repeatBtn.setAttribute(
          "aria-label",
          "Repeat All"
        );

      }

      else if (
        repeatMode === 1
      ) {

        repeatLabel.textContent =
          "1";

        repeatBtn.title =
          "Repeat One";

        repeatBtn.setAttribute(
          "aria-label",
          "Repeat One"
        );

      }

      else {

        repeatLabel.textContent =
          "";

        repeatBtn.title =
          "Repeat Off";

        repeatBtn.setAttribute(
          "aria-label",
          "Repeat Off"
        );

      }

    }


    /* =====================================================
       PROGRESS
    ===================================================== */

    audio.addEventListener(
      "loadedmetadata",
      function() {

        if (
          Number.isFinite(
            audio.duration
          )
        ) {

          durationEl.textContent =
            formatTime(
              audio.duration
            );

        }

      }
    );


    audio.addEventListener(
      "timeupdate",
      function() {

        if (
          !Number.isFinite(
            audio.duration
          )
        ) {

          return;

        }


        progressEl.value =
          (
            audio.currentTime /
            audio.duration
          ) * 100;


        currentTimeEl.textContent =
          formatTime(
            audio.currentTime
          );

      }
    );


    progressEl.oninput =
      function() {

        if (
          Number.isFinite(
            audio.duration
          )
        ) {

          audio.currentTime =
            (
              Number(
                progressEl.value
              ) / 100
            ) *
            audio.duration;

        }

      };


    function formatTime(seconds) {

      if (
        !Number.isFinite(seconds)
      ) {

        return "0:00";

      }


      const minutes =
        Math.floor(
          seconds / 60
        );


      const remaining =
        Math.floor(
          seconds % 60
        );


      return (
        minutes +
        ":" +
        String(
          remaining
        ).padStart(2, "0")
      );

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    searchEl.addEventListener(
      "input",
      function() {

        searchText =
          searchEl.value.trim();

        updateQueue();

        renderSongs();

      }
    );


    /* =====================================================
       THEME
    ===================================================== */

    let savedTheme =
      localStorage.getItem(
        "musicTheme"
      );


    if (
      savedTheme === "light"
    ) {

      document.body.classList.add(
        "light"
      );

    }


    function updateThemeIcon() {

      const light =
        document.body.classList.contains(
          "light"
        );


      themeIcon.textContent =
        light
          ? "☾"
          : "☼";

    }


    themeBtn.onclick =
      function() {

        document.body.classList.toggle(
          "light"
        );


        const light =
          document.body.classList.contains(
            "light"
          );


        localStorage.setItem(
          "musicTheme",
          light
            ? "light"
            : "dark"
        );


        updateThemeIcon();

      };


    updateThemeIcon();


    /* =====================================================
       SERVICE WORKER
    ===================================================== */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register("./sw.js")
            .catch(
              error =>
                console.log(
                  "Service worker:",
                  error
                )
            );

        }
      );

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    updateRepeatUI();

    loadLibrary();

  </script>

</body>
</html>
