<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<meta name="description" content="My Music Player">
<link rel="manifest" href="manifest.json">
<title>My Music Player</title>

<style>
:root{
  --bg:#09090b;
  --surface:#111114;
  --surface-2:#18181c;
  --surface-3:#202025;
  --text:#f5f5f7;
  --text-soft:#a7a7ad;
  --border:rgba(255,255,255,.08);
  --accent:#9b5cff;
  --accent-2:#7c3aed;
  --shadow:0 12px 35px rgba(0,0,0,.35);
  --player-height:205px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:calc(var(--player-height) + 20px);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,9,11,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
}

.header-row{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-size:20px;
  font-weight:700;
  white-space:nowrap;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.header-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface-2);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  transition:.2s;
}

.header-btn:hover,
.header-btn.active{
  background:var(--surface-3);
  border-color:rgba(155,92,255,.45);
}

.search-wrap{
  max-width:1000px;
  margin:10px auto 0;
  display:none;
}

.search-wrap.open{
  display:block;
}

#search{
  width:100%;
  padding:11px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:var(--surface-2);
  color:var(--text);
}

#search:focus{
  border-color:var(--accent);
}

main{
  max-width:1000px;
  margin:auto;
  padding:18px 16px 30px;
}

.section-title{
  margin:0 0 10px;
  font-size:14px;
  color:var(--text-soft);
  font-weight:600;
}

.folders{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.folders::-webkit-scrollbar{
  display:none;
}

.folder{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-soft);
  padding:9px 13px;
  border-radius:11px;
  cursor:pointer;
  transition:.2s;
}

.folder:hover,
.folder.active{
  color:var(--text);
  background:var(--surface-2);
  border-color:rgba(155,92,255,.45);
}

.song-list{
  margin-top:18px;
}

.song{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 13px;
  margin-bottom:7px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:12px;
  transition:.2s;
}

.song:hover{
  background:var(--surface-2);
}

.song.playing{
  border-color:rgba(155,92,255,.55);
  background:rgba(155,92,255,.08);
}

.song-number{
  width:28px;
  text-align:center;
  color:var(--text-soft);
  font-size:13px;
}

.song-info{
  flex:1;
  min-width:0;
  cursor:pointer;
}

.song-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:15px;
}

.song-folder{
  margin-top:3px;
  font-size:12px;
  color:var(--text-soft);
}

.song-fav{
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:var(--text-soft);
  border-radius:9px;
  font-size:17px;
}

.song-fav:hover{
  background:var(--surface-3);
}

.song-fav.active{
  color:var(--accent);
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--text-soft);
}

#player{
  position:fixed;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  min-height:var(--player-height);
  background:rgba(17,17,20,.97);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  box-shadow:var(--shadow);
}

.player-inner{
  position:relative;
  max-width:1000px;
  margin:auto;
  padding:13px 16px;
}

.now-playing{
  text-align:center;
  margin-bottom:10px;
}

.now-title{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.now-folder{
  margin-top:3px;
  color:var(--text-soft);
  font-size:11px;
}

.progress-wrap{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:12px;
}

.time{
  min-width:38px;
  color:var(--text-soft);
  font-size:11px;
  text-align:center;
}

#progress{
  flex:1;
  height:5px;
  appearance:none;
  border-radius:99px;
  outline:none;
  background:linear-gradient(
    to right,
    var(--accent) 0%,
    var(--accent) 0%,
    var(--surface-3) 0%,
    var(--surface-3) 100%
  );
}

#progress::-webkit-slider-thumb{
  appearance:none;
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--accent);
}

#progress::-moz-range-thumb{
  width:13px;
  height:13px;
  border:0;
  border-radius:50%;
  background:var(--accent);
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
}

.control-btn{
  width:47px;
  height:47px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--surface-2);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  transition:.2s;
}

.control-btn:hover,
.control-btn.active{
  background:var(--surface-3);
  border-color:rgba(155,92,255,.5);
}

.control-btn.main{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  font-size:21px;
}

.control-btn.main:hover{
  background:var(--accent-2);
}

.control-btn.small{
  font-size:15px;
}

.status{
  text-align:center;
  margin-top:8px;
  color:var(--text-soft);
  font-size:11px;
}

.volume-popup{
  position:absolute;
  right:16px;
  bottom:75px;
  display:none;
  align-items:center;
  gap:9px;
  padding:10px 11px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:var(--shadow);
}

.volume-popup.open{
  display:flex;
}

.volume-mute{
  width:36px;
  height:36px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface-3);
  color:var(--text);
  cursor:pointer;
}

#volume{
  width:170px;
  height:6px;
  appearance:none;
  border-radius:99px;
  outline:none;
}

#volume::-webkit-slider-thumb{
  appearance:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
}

#volume::-moz-range-thumb{
  width:14px;
  height:14px;
  border:0;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
}

#volume::-moz-range-progress{
  height:6px;
  border-radius:99px;
  background:var(--accent);
}

#volume::-moz-range-track{
  height:6px;
  border-radius:99px;
  background:var(--surface-3);
}

@media(max-width:600px){
  :root{
    --player-height:200px;
  }

  header{
    padding:10px 12px;
  }

  main{
    padding:15px 12px 25px;
  }

  .player-inner{
    padding:11px 12px;
  }

  .control-btn{
    width:44px;
    height:44px;
  }

  .control-btn.main{
    width:54px;
    height:54px;
  }

  .volume-popup{
    right:12px;
    bottom:71px;
  }

  #volume{
    width:145px;
  }
}

@media(max-width:360px){
  .controls{
    gap:4px;
  }

  .control-btn{
    width:40px;
    height:40px;
  }

  .control-btn.main{
    width:52px;
    height:52px;
  }

  .volume-popup{
    right:8px;
  }

  #volume{
    width:125px;
  }
}

/* LIGHT THEME */
body.light{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#eeeeF2;
  --surface-3:#e1e1e7;
  --text:#18181b;
  --text-soft:#66666e;
  --border:rgba(0,0,0,.09);
  --shadow:0 12px 35px rgba(0,0,0,.12);
}

body.light header{
  background:rgba(245,245,247,.94);
}

body.light #player{
  background:rgba(255,255,255,.96);
}

body.light .control-btn.main{
  color:#fff;
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div class="brand">🎵 My Music Player</div>

    <div class="header-actions">
      <button
        type="button"
        id="searchBtn"
        class="header-btn"
        title="Search"
        aria-label="Search"
        aria-expanded="false">🔎</button>

      <button
        type="button"
        id="themeBtn"
        class="header-btn"
        title="Toggle theme"
        aria-label="Toggle theme">☾</button>
    </div>
  </div>

  <div id="searchWrap" class="search-wrap">
    <input
      id="search"
      type="search"
      placeholder="Search songs..."
      autocomplete="off">
  </div>
</header>

<main>

  <div class="section-title">Folders</div>
  <div id="folders" class="folders"></div>

  <div class="song-list">
    <div class="section-title" id="listTitle">Songs</div>
    <div id="songs"></div>
  </div>

</main>

<section id="player">

  <div class="player-inner">

    <div class="now-playing">
      <div id="nowTitle" class="now-title">No song selected</div>
      <div id="nowFolder" class="now-folder"></div>
    </div>

    <div class="progress-wrap">
      <div id="currentTime" class="time">0:00</div>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step=".1"
        aria-label="Song progress">

      <div id="duration" class="time">0:00</div>
    </div>

    <div class="controls">

      <button
        type="button"
        id="shuffleBtn"
        class="control-btn small"
        title="Shuffle"
        aria-label="Shuffle">🔀</button>

      <button
        type="button"
        id="prevBtn"
        class="control-btn"
        title="Previous"
        aria-label="Previous">⏮</button>

      <button
        type="button"
        id="playBtn"
        class="control-btn main"
        title="Play / Pause"
        aria-label="Play / Pause">▶</button>

      <button
        type="button"
        id="nextBtn"
        class="control-btn"
        title="Next"
        aria-label="Next">⏭</button>

      <button
        type="button"
        id="repeatBtn"
        class="control-btn small"
        title="Repeat"
        aria-label="Repeat">🔁</button>

      <button
        type="button"
        id="volumeBtn"
        class="control-btn small"
        title="Volume"
        aria-label="Volume"
        aria-expanded="false">🔊</button>

    </div>

    <div id="volumePopup" class="volume-popup">

      <button
        type="button"
        id="volumeIcon"
        class="volume-mute"
        title="Mute / Unmute"
        aria-label="Mute / Unmute">🔊</button>

      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="100"
        step="1"
        aria-label="Volume">

    </div>

    <div id="status" class="status">Loading library...</div>

  </div>

</section>

<audio id="audio" preload="auto"></audio>

<script>

/* =========================
   CONFIG
========================= */

const API =
  "https://script.google.com/macros/s/AKfycbx__pPoUcKktHd7j78BYa-6ZbxoW3nFfQpHKCW1CuM-4eDRcfTw_5qz5IeLBVY1Jf5f6Q/exec";


/* =========================
   ELEMENTS
========================= */

const audio = document.getElementById("audio");

const foldersEl = document.getElementById("folders");
const songsEl = document.getElementById("songs");
const listTitleEl = document.getElementById("listTitle");

const nowTitleEl = document.getElementById("nowTitle");
const nowFolderEl = document.getElementById("nowFolder");
const statusEl = document.getElementById("status");

const progressEl = document.getElementById("progress");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const repeatBtn = document.getElementById("repeatBtn");

const volumeBtn = document.getElementById("volumeBtn");
const volumePopup = document.getElementById("volumePopup");
const volumeIcon = document.getElementById("volumeIcon");
const volumeEl = document.getElementById("volume");

const searchBtn = document.getElementById("searchBtn");
const searchWrap = document.getElementById("searchWrap");
const searchEl = document.getElementById("search");

const themeBtn = document.getElementById("themeBtn");


/* =========================
   STATE
========================= */

let library = [];
let currentQueue = [];
let currentFolder = "All Songs";
let currentIndex = -1;
let currentSong = null;

let shuffleMode = false;
let repeatMode = 2;
/*
  0 = off
  1 = repeat one
  2 = repeat all
*/

let favorites =
  JSON.parse(
    localStorage.getItem("musicFavorites") || "[]"
  );

let recentlyPlayed =
  JSON.parse(
    localStorage.getItem("musicRecentlyPlayed") || "[]"
  );

let loadRequestId = 0;

const FAVORITES_FOLDER = "⭐ Favorites";
const RECENT_FOLDER = "🕘 Recently Played";


/* =========================
   HELPERS
========================= */

function formatTime(seconds){
  if(!Number.isFinite(seconds)) return "0:00";

  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60)
    .toString()
    .padStart(2,"0");

  return mins + ":" + secs;
}

function setStatus(text){
  statusEl.textContent = text;
}

function saveFavorites(){
  localStorage.setItem(
    "musicFavorites",
    JSON.stringify(favorites)
  );
}

function saveRecentlyPlayed(){
  localStorage.setItem(
    "musicRecentlyPlayed",
    JSON.stringify(recentlyPlayed)
  );
}


/* =========================
   JSONP API
========================= */

function apiJSONP(action, id = ""){
  return new Promise((resolve,reject)=>{

    const callbackName =
      "musicCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(()=>{
        cleanup();
        reject(new Error("Request timed out"));
      },15000);

    function cleanup(){
      clearTimeout(timeout);
      script.remove();
      delete window[callbackName];
    }

    window[callbackName] = data =>{
      cleanup();
      resolve(data);
    };

    script.onerror = ()=>{
      cleanup();
      reject(new Error("API request failed"));
    };

    let url =
      API +
      "?action=" +
      encodeURIComponent(action) +
      "&callback=" +
      callbackName;

    if(id){
      url +=
        "&id=" +
        encodeURIComponent(id);
    }

    script.src = url;

    document.body.appendChild(script);
  });
}


/* =========================
   LIBRARY
========================= */

async function loadLibrary(){

  setStatus("Loading library...");

  try{

    const data =
      await apiJSONP("library");

    if(data && data.error){
      throw new Error(data.error);
    }

    library =
      Array.isArray(data)
        ? data
        : [];

    renderFolders();
    updateQueue();

    setStatus(
      library.length +
      " song" +
      (library.length === 1 ? "" : "s") +
      " available"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Could not load music library"
    );
  }
}


/* =========================
   FOLDERS
========================= */

function getFolders(){

  const folderSet =
    new Set(
      library.map(song => song.folder || "All Songs")
    );

  const folders =
    ["All Songs"];

  if(favorites.length){
    folders.push(FAVORITES_FOLDER);
  }

  if(recentlyPlayed.length){
    folders.push(RECENT_FOLDER);
  }

  [...folderSet]
    .filter(folder => folder !== "All Songs")
    .sort((a,b)=>a.localeCompare(b))
    .forEach(folder => folders.push(folder));

  return folders;
}

function renderFolders(){

  foldersEl.innerHTML = "";

  getFolders().forEach(folder =>{

    const button =
      document.createElement("button");

    button.type = "button";
    button.className =
      "folder" +
      (folder === currentFolder ? " active" : "");

    button.textContent = folder;

    button.onclick = ()=>{
      currentFolder = folder;
      renderFolders();
      updateQueue();
    };

    foldersEl.appendChild(button);
  });
}


/* =========================
   QUEUE
========================= */

function updateQueue(){

  let songs = [];

  if(currentFolder === FAVORITES_FOLDER){

    songs =
      library.filter(song =>
        favorites.includes(song.id)
      );

  }else if(currentFolder === RECENT_FOLDER){

    songs =
      recentlyPlayed
        .map(id =>
          library.find(song => song.id === id)
        )
        .filter(Boolean);

  }else if(currentFolder === "All Songs"){

    songs = [...library];

  }else{

    songs =
      library.filter(
        song =>
          (song.folder || "All Songs") === currentFolder
      );
  }

  const query =
    searchEl.value.trim().toLowerCase();

  if(query){

    songs =
      songs.filter(song =>
        song.name.toLowerCase().includes(query)
      );
  }

  currentQueue = songs;

  renderSongs();
}


/* =========================
   SONG LIST
========================= */

function renderSongs(){

  songsEl.innerHTML = "";

  listTitleEl.textContent =
    currentFolder +
    " (" +
    currentQueue.length +
    ")";

  if(!currentQueue.length){

    songsEl.innerHTML =
      '<div class="empty">No songs found</div>';

    return;
  }

  currentQueue.forEach((song,index)=>{

    const row =
      document.createElement("div");

    row.className =
      "song" +
      (
        currentSong &&
        currentSong.id === song.id
          ? " playing"
          : ""
      );

    const number =
      document.createElement("div");

    number.className = "song-number";
    number.textContent = index + 1;

    const info =
      document.createElement("div");

    info.className = "song-info";

    const name =
      document.createElement("div");

    name.className = "song-name";
    name.textContent = song.name;

    const folder =
      document.createElement("div");

    folder.className = "song-folder";
    folder.textContent =
      song.folder || "All Songs";

    info.appendChild(name);
    info.appendChild(folder);

    info.onclick = ()=>{
      playSongByIndex(index);
    };

    const fav =
      document.createElement("button");

    fav.type = "button";
    fav.className =
      "song-fav" +
      (
        favorites.includes(song.id)
          ? " active"
          : ""
      );

    fav.textContent =
      favorites.includes(song.id)
        ? "★"
        : "☆";

    fav.title = "Favorite";

    fav.onclick = event =>{
      event.stopPropagation();
      toggleFavorite(song.id);
    };

    row.appendChild(number);
    row.appendChild(info);
    row.appendChild(fav);

    songsEl.appendChild(row);
  });
}


/* =========================
   FAVORITES
========================= */

function toggleFavorite(id){

  if(favorites.includes(id)){

    favorites =
      favorites.filter(
        item => item !== id
      );

  }else{

    favorites.push(id);
  }

  saveFavorites();

  renderFolders();
  updateQueue();
}


/* =========================
   RECENTLY PLAYED
========================= */

function addToRecentlyPlayed(id){

  recentlyPlayed =
    recentlyPlayed.filter(
      item => item !== id
    );

  recentlyPlayed.unshift(id);

  recentlyPlayed =
    recentlyPlayed.slice(0,50);

  saveRecentlyPlayed();

  renderFolders();

  if(
    currentFolder === RECENT_FOLDER
  ){
    updateQueue();
  }
}


/* =========================
   PLAY SONG
========================= */

async function playSongByIndex(index){

  if(
    index < 0 ||
    index >= currentQueue.length
  ){
    return;
  }

  const song =
    currentQueue[index];

  const requestId =
    ++loadRequestId;

  currentIndex = index;
  currentSong = song;

  nowTitleEl.textContent = song.name;
  nowFolderEl.textContent =
    song.folder || "All Songs";

  renderSongs();

  setStatus("Loading...");

  try{

    const data =
      await apiJSONP("song",song.id);

    if(requestId !== loadRequestId){
      return;
    }

    if(data && data.error){
      throw new Error(data.error);
    }

    const bytes =
      Uint8Array.from(
        atob(data.base64),
        char => char.charCodeAt(0)
      );

    const blob =
      new Blob(
        [bytes],
        {type:data.type || song.type || "audio/mpeg"}
      );

    const url =
      URL.createObjectURL(blob);

    audio.pause();
    audio.src = url;
    audio.currentTime = 0;

    addToRecentlyPlayed(song.id);

    await audio.play();

    playBtn.textContent = "⏸";
    setStatus("Playing");

    renderSongs();

  }catch(error){

    console.error(error);

    if(requestId !== loadRequestId){
      return;
    }

    setStatus(
      "Could not play this song"
    );
  }
}


/* =========================
   PLAY / PAUSE
========================= */

playBtn.onclick = async ()=>{

  if(!currentSong){

    if(currentQueue.length){
      playSongByIndex(0);
    }

    return;
  }

  if(audio.paused){

    try{
      await audio.play();
      playBtn.textContent = "⏸";
      setStatus("Playing");
    }catch(error){
      console.error(error);
    }

  }else{

    audio.pause();
    playBtn.textContent = "▶";
    setStatus("Paused");
  }
};


/* =========================
   NEXT
========================= */

function nextSong(){

  if(!currentQueue.length){
    return;
  }

  let nextIndex;

  if(shuffleMode){

    if(currentQueue.length === 1){
      nextIndex = 0;
    }else{

      do{
        nextIndex =
          Math.floor(
            Math.random() *
            currentQueue.length
          );
      }while(nextIndex === currentIndex);
    }

  }else{

    nextIndex =
      currentIndex + 1;

    if(nextIndex >= currentQueue.length){
      nextIndex = 0;
    }
  }

  playSongByIndex(nextIndex);
}


/* =========================
   PREVIOUS
========================= */

function previousSong(){

  if(!currentQueue.length){
    return;
  }

  if(audio.currentTime > 3){

    audio.currentTime = 0;
    return;
  }

  let prevIndex =
    currentIndex - 1;

  if(prevIndex < 0){
    prevIndex =
      currentQueue.length - 1;
  }

  playSongByIndex(prevIndex);
}

nextBtn.onclick = nextSong;
prevBtn.onclick = previousSong;


/* =========================
   SHUFFLE
========================= */

shuffleBtn.onclick = ()=>{

  shuffleMode =
    !shuffleMode;

  shuffleBtn.classList.toggle(
    "active",
    shuffleMode
  );

  shuffleBtn.title =
    shuffleMode
      ? "Shuffle On"
      : "Shuffle Off";
};


/* =========================
   REPEAT
========================= */

function updateRepeatUI(){

  if(repeatMode === 0){

    repeatBtn.textContent = "🔁";
    repeatBtn.classList.remove("active");
    repeatBtn.title = "Repeat Off";

  }else if(repeatMode === 1){

    repeatBtn.textContent = "🔂";
    repeatBtn.classList.add("active");
    repeatBtn.title = "Repeat One";

  }else{

    repeatBtn.textContent = "🔁";
    repeatBtn.classList.add("active");
    repeatBtn.title = "Repeat All";
  }
}

repeatBtn.onclick = ()=>{

  repeatMode++;

  if(repeatMode > 2){
    repeatMode = 0;
  }

  updateRepeatUI();
};

updateRepeatUI();


/* =========================
   AUDIO ENDED
========================= */

audio.addEventListener("ended",()=>{

  if(repeatMode === 1){

    audio.currentTime = 0;
    audio.play();
    return;
  }

  if(repeatMode === 2){

    nextSong();
    return;
  }

  if(currentIndex < currentQueue.length - 1){

    nextSong();

  }else{

    playBtn.textContent = "▶";
    setStatus("Finished");
  }
});


/* =========================
   AUDIO PROGRESS
========================= */

audio.addEventListener("loadedmetadata",()=>{

  durationEl.textContent =
    formatTime(audio.duration);
});

audio.addEventListener("timeupdate",()=>{

  if(!audio.duration){
    return;
  }

  const percent =
    (audio.currentTime / audio.duration) * 100;

  progressEl.value = percent;

  progressEl.style.background =
    `linear-gradient(
      to right,
      var(--accent) 0%,
      var(--accent) ${percent}%,
      var(--surface-3) ${percent}%,
      var(--surface-3) 100%
    )`;

  currentTimeEl.textContent =
    formatTime(audio.currentTime);
});

progressEl.addEventListener("input",()=>{

  if(!audio.duration){
    return;
  }

  audio.currentTime =
    (Number(progressEl.value) / 100) *
    audio.duration;
});


/* =========================
   VOLUME
========================= */

function updateVolumeUI(){

  const value =
    Number(volumeEl.value);

  let icon;

  if(value === 0){
    icon = "🔇";
  }else if(value < 50){
    icon = "🔉";
  }else{
    icon = "🔊";
  }

  volumeIcon.textContent = icon;
  volumeBtn.textContent = icon;

  volumeEl.style.background =
    `linear-gradient(
      to right,
      var(--accent) 0%,
      var(--accent) ${value}%,
      var(--surface-3) ${value}%,
      var(--surface-3) 100%
    )`;
}

const savedVolume =
  localStorage.getItem("musicVolume");

if(savedVolume !== null){

  const value =
    Math.min(
      100,
      Math.max(
        0,
        Number(savedVolume)
      )
    );

  audio.volume =
    value / 100;

  volumeEl.value = value;

}else{

  audio.volume = 1;
}

updateVolumeUI();


volumeBtn.onclick = ()=>{

  const open =
    volumePopup.classList.toggle("open");

  volumeBtn.classList.toggle(
    "active",
    open
  );

  volumeBtn.setAttribute(
    "aria-expanded",
    String(open)
  );
};


volumeEl.addEventListener("input",()=>{

  const value =
    Number(volumeEl.value);

  audio.volume =
    value / 100;

  localStorage.setItem(
    "musicVolume",
    String(value)
  );

  if(value > 0){

    localStorage.setItem(
      "previousVolume",
      String(value)
    );
  }

  updateVolumeUI();
});


volumeIcon.onclick = ()=>{

  if(audio.volume > 0){

    localStorage.setItem(
      "previousVolume",
      volumeEl.value
    );

    audio.volume = 0;
    volumeEl.value = 0;

  }else{

    const previous =
      Number(
        localStorage.getItem(
          "previousVolume"
        ) || "100"
      );

    audio.volume =
      previous / 100;

    volumeEl.value =
      previous;

    localStorage.setItem(
      "musicVolume",
      String(previous)
    );
  }

  updateVolumeUI();
};


/* =========================
   SEARCH
========================= */

searchBtn.onclick = ()=>{

  const open =
    searchWrap.classList.toggle("open");

  searchBtn.classList.toggle(
    "active",
    open
  );

  searchBtn.textContent =
    open ? "✕" : "🔎";

  searchBtn.setAttribute(
    "aria-expanded",
    String(open)
  );

  if(open){

    searchEl.focus();

  }else{

    searchEl.value = "";
    updateQueue();
  }
};

searchEl.addEventListener("input",()=>{
  updateQueue();
});

searchEl.addEventListener("keydown",event=>{

  if(event.key === "Escape"){
    searchBtn.click();
  }
});


/* =========================
   THEME
========================= */

function applyTheme(){

  const light =
    localStorage.getItem("musicTheme") === "light";

  document.body.classList.toggle(
    "light",
    light
  );

  themeBtn.textContent =
    light ? "☀" : "☾";
}

themeBtn.onclick = ()=>{

  const light =
    !document.body.classList.contains("light");

  localStorage.setItem(
    "musicTheme",
    light ? "light" : "dark"
  );

  applyTheme();
};

applyTheme();


/* =========================
   CLOSE VOLUME POPUP
========================= */

document.addEventListener("click",event=>{

  if(
    !volumePopup.contains(event.target) &&
    !volumeBtn.contains(event.target)
  ){

    volumePopup.classList.remove("open");

    volumeBtn.classList.remove("active");

    volumeBtn.setAttribute(
      "aria-expanded",
      "false"
    );
  }
});


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker
      .register("sw.js")
      .catch(error =>
        console.log(
          "Service worker:",
          error
        )
      );
  });
}


/* =========================
   START
========================= */

loadLibrary();

</script>

</body>
</html>
