<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<title>jus Music</title>
<style>
:root{--bg:#09090b;--s1:#111114;--s2:#18181c;--s3:#202025;--tx:#f5f5f7;--soft:#a7a7ad;--bd:rgba(255,255,255,.09);--ac:#9b5cff;--ac2:#7c3aed}
body.light{--bg:#f6f6f8;--s1:#fff;--s2:#f0f0f3;--s3:#e4e4e9;--tx:#111114;--soft:#66666d;--bd:rgba(0,0,0,.09)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:190px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--s1);border-bottom:1px solid var(--bd);padding:12px 16px}
.row{display:flex;align-items:center;gap:8px;max-width:1000px;margin:auto}.grow{flex:1;min-width:0}
h1{font-size:20px;margin:0;white-space:nowrap}.who{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--s2);font-size:18px}
.ib:hover,.ib.on{color:var(--ac);border-color:var(--ac)}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);outline:none}
input:focus,select:focus{border-color:var(--ac)}
main{max-width:1000px;margin:auto;padding:14px 14px 0}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;border:1px solid var(--bd);background:var(--s2);color:var(--soft);white-space:nowrap}
.chip.on{background:var(--ac2);color:#fff;border-color:transparent}
#list{display:grid;gap:8px;margin-top:8px}@media(min-width:760px){#list{grid-template-columns:1fr 1fr}}
.song{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;min-height:62px;border-radius:14px;border:1px solid var(--bd);background:var(--s1)}
.song.on{border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.song .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song .a{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:36px;height:36px;border:0;background:none;color:var(--soft);font-size:20px;border-radius:50%}.mini.on{color:var(--ac)}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
#player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s1);border-top:1px solid var(--bd);padding:10px 16px max(12px,env(safe-area-inset-bottom))}
.pin{max-width:800px;margin:auto}#np{text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;gap:8px;margin:8px 0}.tm{width:38px;font-size:12px;color:var(--soft);text-align:center}
input[type=range]{padding:0;height:5px;border:0;border-radius:9px;appearance:none;-webkit-appearance:none;background:var(--s3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ac)}
.ctl{display:flex;justify-content:center;gap:8px}
.cb{width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--s2);font-size:18px}
.cb.on{color:var(--ac);border-color:var(--ac)}.cb.main{width:58px;height:58px;border-radius:50%;background:var(--ac2);color:#fff;border:0}
#status{text-align:center;font-size:12px;color:var(--soft);min-height:16px;margin-top:6px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:20px}
.card h2{margin:0 0 14px;font-size:19px}.card label{display:block;font-size:12px;color:var(--soft);margin:11px 0 4px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac2);color:#fff;font-weight:600}.btn.alt{background:var(--s3);color:var(--tx)}.btn:disabled{opacity:.5}
.msg{margin-top:10px;font-size:13px;color:#ff7b8a;min-height:16px}.msg.ok{color:#6ee7a0}.link{background:none;border:0;color:var(--ac);width:100%;margin-top:10px}
</style></head><body>

<div id="auth" class="ov hide" style="background:var(--bg)"><div class="card">
  <h2 id="aTitle">♫ Sign in</h2>
  <label>Username</label><input id="aUser" autocapitalize="none" autocomplete="username">
  <div id="regOnly" class="hide"><label>Display name</label><input id="aName"><label>Invite code</label><input id="aInvite"></div>
  <label>Password</label><input id="aPass" type="password" autocomplete="current-password">
  <button class="btn" id="aGo">Sign in</button><div class="msg" id="aMsg"></div>
  <button class="link" id="aSwitch">Create an account</button>
</div></div>

<header><div class="row">
  <div class="grow"><h1>♫ My Music Player</h1><div class="who" id="who"></div></div>
  <button class="ib" id="bSearch" title="Search">⌕</button>
  <button class="ib hide" id="bUp" title="Upload song">⤒</button>
  <button class="ib" id="bTheme" title="Theme">☼</button>
  <button class="ib" id="bOut" title="Sign out">⎋</button>
</div><div class="row hide" id="sWrap" style="margin-top:10px"><input id="search" type="search" placeholder="Search title, artist, genre..." autocomplete="off"></div></header>

<main><div id="chips"></div><div id="list"></div></main>

<section id="player"><div class="pin">
  <div id="np">Nothing playing</div>
  <div class="pr"><span class="tm" id="cur">0:00</span><input id="prog" type="range" min="0" max="100" value="0" step="0.1"><span class="tm" id="dur">0:00</span></div>
  <div class="ctl">
    <button class="cb" id="bShuf" title="Shuffle">⇄</button><button class="cb" id="bPrev" title="Previous">⏮</button>
    <button class="cb main" id="bPlay" title="Play/Pause">▶</button><button class="cb" id="bNext" title="Next">⏭</button>
    <button class="cb on" id="bRep" title="Repeat">↻</button>
  </div><div id="status">Ready</div>
</div></section>
<audio id="audio" preload="none"></audio>

<div id="upModal" class="ov hide"><div class="card">
  <h2>Upload song</h2>
  <input id="uFile" type="file" accept="audio/*">
  <label>Song title</label><input id="uTitle">
  <label>Artist</label><input id="uArtist">
  <label>Language</label><select id="uLang"></select>
  <label>Genre</label><input id="uGenre" list="genres" placeholder="Bollywood, EDM, Pop...">
  <datalist id="genres"><option>Bollywood</option><option>Pop</option><option>EDM</option><option>Hip-Hop</option><option>Rock</option><option>Classical</option><option>Devotional</option><option>Ghazal</option><option>Recitation</option></datalist>
  <button class="btn" id="uGo">Upload</button><button class="btn alt" id="uCancel">Close</button><div class="msg" id="uMsg"></div>
</div></div>

<script>
/* ===== SETTINGS: only this line needs your Apps Script Web App URL (ends with /exec) ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbx__pPoUcKktHd7j78BYa-6Zbxo3WnFfQpHKCW1CuM-4eDRcfTw_5qz5IeLBVY1Jf5f6Q/exec";

const $ = id => document.getElementById(id), audio = $("audio");
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
let token = LS.get("mp_token",""), me = null, library = [], queue = [], idx = -1, cur = null, folder = "All", q = "";
let favs = LS.get("mp_favs",[]), recent = LS.get("mp_recent",[]), repeat = 2, shuffle = false, reqId = 0, ctrl = null, timer = null, objUrl = null, canUpload = false;
const FAV = "⭐ Favorites", REC = "🕘 Recent", status = t => $("status").textContent = t;

/* ---------- API ---------- */
async function api(fn, args, signal, ms) {
  const t = setTimeout(() => ctrl && 0, 0);
  const res = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn, args}), signal: signal || AbortSignal.timeout(ms || 60000) });
  clearTimeout(t);
  const r = await res.json();
  if (r && r.auth === false) { showAuth(); throw new Error("Please sign in again."); }
  return r;
}

/* ---------- LOGIN ---------- */
let reg = false;
function showAuth() { token = ""; LS.set("mp_token",""); audio.pause(); $("auth").classList.remove("hide"); }
$("aSwitch").onclick = () => { reg = !reg; $("regOnly").classList.toggle("hide", !reg); $("aTitle").textContent = reg ? "♫ Create account" : "♫ Sign in";
  $("aGo").textContent = reg ? "Create account" : "Sign in"; $("aSwitch").textContent = reg ? "I already have an account" : "Create an account"; $("aMsg").textContent = ""; };
$("aGo").onclick = async () => {
  $("aGo").disabled = true; $("aMsg").textContent = "Please wait...";
  try {
    const r = reg ? await api("registerAccount",[$("aUser").value,$("aPass").value,$("aName").value,$("aInvite").value])
                  : await api("loginAccount",[$("aUser").value,$("aPass").value]);
    if (!r.ok) { $("aMsg").textContent = r.message; return; }
    token = r.sessionToken; LS.set("mp_token", token); me = r.user; $("aPass").value = ""; $("auth").classList.add("hide"); startApp();
  } catch (e) { $("aMsg").textContent = "Could not reach server. Check internet / API URL."; }
  finally { $("aGo").disabled = false; }
};
$("aPass").addEventListener("keydown", e => e.key === "Enter" && $("aGo").click());
$("bOut").onclick = async () => { try { await api("logoutAccount",[token]); } catch(e){} showAuth(); };

async function boot() {
  if (!token) return showAuth();
  try { const r = await api("getCurrentUser",[token]); if (!r.ok) return showAuth(); me = r.user; startApp(); }
  catch (e) { status("Offline or server unreachable"); }
}
function startApp() { $("who").textContent = me.displayName + " · " + me.role; loadLibrary(); }

/* ---------- LIBRARY ---------- */
async function loadLibrary() {
  status("Loading library...");
  try {
    const r = await api("getLibrary",[token]); if (!r.ok) throw new Error(r.message);
    library = r.songs; canUpload = r.canUpload; $("bUp").classList.toggle("hide", !canUpload);
    build(); status(library.length + " songs");
  } catch (e) { status("Could not load library"); }
}
function build() {
  const langs = [...new Set(library.map(s => s.language).filter(Boolean))].sort();
  $("chips").innerHTML = "";
  ["All", FAV, REC, ...langs].forEach(n => { const b = document.createElement("button"); b.className = "chip" + (n === folder ? " on" : ""); b.textContent = n;
    b.onclick = () => { folder = n; build(); }; $("chips").appendChild(b); });
  updateQueue(); render();
}
function updateQueue() {
  let l = folder === FAV ? library.filter(s => favs.includes(s.id)) : folder === REC ? recent.map(id => library.find(s => s.id === id)).filter(Boolean)
        : library.filter(s => folder === "All" || s.language === folder);
  if (q) l = l.filter(s => (s.title + " " + s.artist + " " + s.genre).toLowerCase().includes(q));
  queue = l; if (cur) idx = queue.findIndex(s => s.id === cur.id);
}
function render() {
  const el = $("list"); el.innerHTML = "";
  if (!queue.length) { el.innerHTML = '<div class="empty">No songs found</div>'; return; }
  queue.forEach((s, i) => {
    const r = document.createElement("div"); r.className = "song" + (cur && cur.id === s.id ? " on" : "");
    const info = document.createElement("div"); info.className = "grow";
    info.innerHTML = '<div class="t"></div><div class="a"></div>'; info.children[0].textContent = s.title;
    info.children[1].textContent = [s.artist, s.genre].filter(Boolean).join(" · ") || s.language;
    const f = document.createElement("button"); f.className = "mini" + (favs.includes(s.id) ? " on" : ""); f.textContent = favs.includes(s.id) ? "♥" : "♡";
    f.onclick = e => { e.stopPropagation(); favs = favs.includes(s.id) ? favs.filter(x => x !== s.id) : [...favs, s.id]; LS.set("mp_favs", favs); updateQueue(); render(); };
    r.append(info, f);
    if (s.canDelete) { const d = document.createElement("button"); d.className = "mini"; d.textContent = "🗑"; d.title = "Delete";
      d.onclick = async e => { e.stopPropagation(); if (!confirm('Delete "' + s.title + '"?')) return; const x = await api("deleteSong",[token, s.id]);
        if (!x.ok) return alert(x.message); library = library.filter(y => y.id !== s.id); if (cur && cur.id === s.id) { audio.pause(); cur = null; } build(); }; r.append(d); }
    r.onclick = () => play(i); el.appendChild(r);
  });
}
$("bSearch").onclick = () => { const o = $("sWrap").classList.toggle("hide") === false; $("bSearch").classList.toggle("on", o);
  if (o) $("search").focus(); else { $("search").value = ""; q = ""; updateQueue(); render(); } };
$("search").oninput = () => { q = $("search").value.trim().toLowerCase(); updateQueue(); render(); };

/* ---------- PLAY (only the latest tapped song is ever loaded) ---------- */
function play(i) {
  if (i < 0 || i >= queue.length) return;
  idx = i; cur = queue[i]; const my = ++reqId;
  if (ctrl) ctrl.abort(); clearTimeout(timer);
  audio.pause(); audio.removeAttribute("src"); audio.load();
  if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
  $("np").textContent = cur.title; status("Loading..."); render(); media();
  timer = setTimeout(async () => {                       // short wait so rapid taps don't send requests
    ctrl = new AbortController();
    try {
      const r = await api("getSong",[token, cur.id], ctrl.signal); if (my !== reqId) return;
      if (!r.ok) throw new Error(r.message);
      const blob = await (await fetch("data:" + r.mimeType + ";base64," + r.base64)).blob(); if (my !== reqId) return;
      objUrl = URL.createObjectURL(blob); audio.src = objUrl; await audio.play(); if (my !== reqId) return;
      recent = [cur.id, ...recent.filter(x => x !== cur.id)].slice(0, 20); LS.set("mp_recent", recent);
    } catch (e) { if (my === reqId && e.name !== "AbortError") status("Could not play song"); }
  }, 250);
}
function next(auto) {
  if (!queue.length) return;
  let n;
  if (shuffle && queue.length > 1) { do n = Math.floor(Math.random() * queue.length); while (n === idx); }
  else { n = idx + 1; if (n >= queue.length) { if (auto && repeat === 0) { audio.pause(); status("Finished"); return; } n = 0; } }   // Next button always loops
  play(n);
}
function prev() { if (!queue.length) return; if (audio.currentTime > 3) { audio.currentTime = 0; return; } play(idx <= 0 ? queue.length - 1 : idx - 1); }
$("bNext").onclick = () => next(false); $("bPrev").onclick = prev;
$("bPlay").onclick = () => { if (!cur) return play(0); audio.paused ? audio.play().catch(()=>{}) : audio.pause(); };
$("bShuf").onclick = () => { shuffle = !shuffle; $("bShuf").classList.toggle("on", shuffle); status(shuffle ? "Shuffle on" : "Shuffle off"); };
$("bRep").onclick = () => { repeat = (repeat + 2) % 3; $("bRep").textContent = repeat === 1 ? "↻¹" : "↻"; $("bRep").classList.toggle("on", repeat > 0);
  status(["Repeat off","Repeat one","Repeat all"][repeat]); };
audio.onplay = () => { $("bPlay").textContent = "⏸"; status("Playing"); };
audio.onpause = () => { $("bPlay").textContent = "▶"; if (cur && audio.currentTime > 0 && !audio.ended) status("Paused"); };
audio.onended = () => { if (repeat === 1) { audio.currentTime = 0; audio.play(); } else next(true); };
audio.onloadedmetadata = () => $("dur").textContent = fmt(audio.duration);
audio.ontimeupdate = () => { if (!isFinite(audio.duration)) return; const p = audio.currentTime / audio.duration * 100; $("prog").value = p;
  $("prog").style.background = `linear-gradient(to right,var(--ac) ${p}%,var(--s3) ${p}%)`; $("cur").textContent = fmt(audio.currentTime); };
$("prog").oninput = () => { if (isFinite(audio.duration)) audio.currentTime = $("prog").value / 100 * audio.duration; };
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
function media() {                                        // lock-screen / notification controls on Android
  if (!("mediaSession" in navigator) || !cur) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: cur.title, artist: cur.artist || cur.language, album: "My Music Player", artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}] });
  [["play",()=>audio.play()],["pause",()=>audio.pause()],["nexttrack",()=>next(false)],["previoustrack",prev]].forEach(([a,f]) => { try { navigator.mediaSession.setActionHandler(a, f); } catch(e){} });
}

/* ---------- UPLOAD ---------- */
const sha256 = async buf => [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(b => b.toString(16).padStart(2, "0")).join("");
const toB64 = buf => { let s = "", b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode.apply(null, b.subarray(i, i + 32768)); return btoa(s); };
$("bUp").onclick = () => {
  const langs = [...new Set(["Hindi","English","Telugu","Quran","Other", ...library.map(s => s.language)])];
  $("uLang").innerHTML = langs.map(l => `<option>${l.replace(/[<>&]/g,"")}</option>`).join(""); $("uMsg").textContent = ""; $("upModal").classList.remove("hide"); };
$("uCancel").onclick = () => $("upModal").classList.add("hide");
$("uFile").onchange = () => { const f = $("uFile").files[0]; if (!f) return; let n = f.name.replace(/\.[^.]+$/, "").replace(/_/g, " ");
  const m = n.split(" - "); if (m.length === 2) { $("uArtist").value = m[0].trim(); n = m[1].trim(); } $("uTitle").value = n; };
$("uGo").onclick = async () => {
  const f = $("uFile").files[0], msg = $("uMsg"); msg.className = "msg";
  if (!f) { msg.textContent = "Choose a song file first."; return; }
  if (f.size > 25 * 1024 * 1024) { msg.textContent = "File is larger than 25 MB."; return; }
  $("uGo").disabled = true;
  try {
    msg.textContent = "Checking for duplicates..."; const buf = await f.arrayBuffer(), h = await sha256(buf);
    const d = await api("checkDuplicate",[token, $("uTitle").value, $("uArtist").value, h]);
    if (d.duplicate) { msg.textContent = d.duplicate.type === "exact" ? "This exact file is already in the library." : "Same title and artist already exists."; return; }
    msg.textContent = "Uploading... please wait";
    const r = await api("uploadSong",[token, f.name, f.type || "audio/mpeg", toB64(buf), { title:$("uTitle").value, artist:$("uArtist").value, language:$("uLang").value, genre:$("uGenre").value }, h], null, 180000);
    if (!r.ok) { msg.textContent = r.message; return; }
    library.push(r.song); msg.className = "msg ok"; msg.textContent = "Uploaded!"; $("uFile").value = ""; $("uTitle").value = $("uArtist").value = $("uGenre").value = ""; build();
  } catch (e) { msg.textContent = "Upload failed: " + e.message; }
  finally { $("uGo").disabled = false; }
};

/* ---------- THEME / PWA ---------- */
if (LS.get("mp_light", false)) document.body.classList.add("light");
$("bTheme").onclick = () => { const l = document.body.classList.toggle("light"); LS.set("mp_light", l); $("bTheme").textContent = l ? "☾" : "☼"; };
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
boot();
</script></body></html>
